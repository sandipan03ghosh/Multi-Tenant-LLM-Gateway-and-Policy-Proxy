# Redis configuration for local development.
# Persistence is enabled so circuit-breaker state, rate-limit buckets, queues, and cached config
# survive a container restart during development.

# --- Append-only file (AOF): primary durability mechanism ---
appendonly yes
appendfsync everysec
appenddirname "aof"

# --- RDB snapshots: secondary/backup durability ---
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

dir /data

# --- Networking ---
# Bind to all interfaces inside the container; host exposure is the compose port mapping's job.
bind 0.0.0.0
protected-mode no
