# Dashboard provider config — dashboards are provisioned as JSON checked into the repo, not
# hand-built in the Grafana UI.

apiVersion: 1

providers:
  - name: "gateway-dashboards"
    orgId: 1
    folder: "LLM Gateway"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
