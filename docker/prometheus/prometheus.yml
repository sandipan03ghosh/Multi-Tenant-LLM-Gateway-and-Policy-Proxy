# Prometheus config for local development.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # api and worker each expose /metrics on METRICS_PORT (9100), never published to the host.
  - job_name: "gateway-api"
    static_configs:
      - targets: ["api:9100"]

  - job_name: "gateway-worker"
    static_configs:
      - targets: ["worker:9100"]
