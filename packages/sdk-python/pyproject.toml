[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway-sdk"
version = "0.1.0"
description = "Python SDK — thin typed HTTP client over the Gateway's Public API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway_sdk"]
